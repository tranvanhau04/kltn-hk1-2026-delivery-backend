name: Node.js CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "task/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: test-jwt-secret-key-for-github-ci-123456
      JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-github-ci-123456

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: sapassword
          MYSQL_DATABASE: delivery_db
        ports:
          - 3308:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Lint check
      - name: Run Linter
        run: npm run lint

      # 5. TypeScript strict type check (Quality Gate - zero errors required)
      - name: TypeScript Type Check
        run: npx tsc --noEmit

      # 6. Unit Tests (VRP solver + Routes service + all specs)
      - name: Run Unit Tests
        run: npm run test -- --forceExit --passWithNoTests

      # 7. NestJS production build
      - name: Build Project
        run: npm run build
